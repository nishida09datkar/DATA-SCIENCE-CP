# Tests on every push and PR to main. No network calls in tests and no API key:
# the template narrator and the LSA backend need neither (PLAN section 8).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # dev extra only: sentence-transformers/torch are not needed, retrieval tests fake them
      - name: Install
        run: uv sync --locked --extra dev

      - name: Test
        run: uv run --no-sync pytest
