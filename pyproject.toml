[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi-rca-engine"
version = "0.1.0"
readme = "README.md"
description = "Autonomous KPI root-cause analysis: STL + Isolation Forest detection, LightGBM + SHAP segment isolation, FAISS ticket retrieval, schema-guarded LLM incident memos"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lightgbm>=4.5",
    "shap>=0.46",
    "faiss-cpu>=1.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "anthropic>=1.14",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
kpi-rca = "kpi_rca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
